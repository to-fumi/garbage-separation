ktor:
  application:
    modules:
      - com.toyokawa.ApplicationKt.module
  deployment:
    host: $HOST:127.0.0.1
    port: $PORT:8080
    watch:
      - classes
      - resources
  development: true
envConfig:
  env:
    $?KTOR_ENV
  database:
    host: $DB_HOST
    port: $DB_PORT
    name: $DB_NAME
    schema: $DB_SCHEMA
    user: $DB_USER
    password: $DB_PASSWORD
    className: $DB_DRIVER
